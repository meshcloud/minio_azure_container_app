version: '3.8'

services:
  ssh-server:
    build:
      context: .
      dockerfile: Dockerfile.ssh-server
    container_name: ssh-test-server
    ports:
      - "2222:2222"
    extra_hosts:
      - "auth.localhost:host-gateway"
    networks:
      - opkssh-net

networks:
  opkssh-net:
    driver: bridge
